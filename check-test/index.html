<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перевірка Gemini Dot — п’ять питань</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafbfe;color:#202434;font-family:Arial,sans-serif}main{max-width:1600px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;color:#636b80;font-size:15px;margin-bottom:18px}.track{height:5px;background:#e2e5ed;border-radius:4px;overflow:hidden}.bar{height:100%;background:#4657b8;transition:width .2s}h1{font-size:clamp(24px,2.4vw,36px);line-height:1.25;margin:26px 0 12px}.hint{color:#656c7f;font-size:17px;margin:0 0 24px}.options{display:grid;grid-template-columns:1fr 1fr;gap:16px}.option{display:flex;align-items:center;gap:26px;min-height:94px;padding:18px;background:white;border:2px solid #e8eaf1;border-radius:16px;cursor:pointer;font-size:20px;font-weight:600;box-shadow:0 2px 5px #18254b04}.option:has(input:checked){border-color:#4657b8;background:#f0f2ff}.num{font-size:25px;font-weight:400;color:#3d4353;min-width:36px;text-align:center}.text{flex:1}.option input{width:23px;height:23px;accent-color:#4657b8;flex-shrink:0}.submit{width:100%;padding:20px;border:0;border-radius:13px;background:#4657b8;color:white;font-size:22px;font-weight:700;cursor:pointer;margin-top:22px}.submit:disabled{opacity:.45;cursor:not-allowed}.option:focus-within,.submit:focus-visible{outline:3px solid #91a8ff;outline-offset:3px}.foot{font-size:14px;color:#747c8e;margin-top:20px}.score{font-size:42px;color:#4657b8;margin:24px 0}.review{background:white;border:1px solid #e2e5ed;border-radius:12px;padding:20px;margin:14px 0;line-height:1.6}.review h2{font-size:20px;margin:0 0 10px}.ok{color:#176643}.bad{color:#a53434}[hidden]{display:none!important}@media(max-width:650px){main{padding:20px 12px}.option{font-size:16px;gap:12px;padding:12px;min-height:100px}.num{min-width:24px}.hint{font-size:15px}}
</style>
<main>
 <header><span>Тренувальний тест · Gemini Dot</span><span id="counter"></span></header>
 <div class="track"><div class="bar" id="bar"></div></div>
 <section id="quiz"><h1 id="question"></h1><p class="hint" id="hint"></p><form id="form"><div class="options" id="options"></div><button class="submit" id="next" disabled>Готово →</button></form><p class="foot">Перш ніж перейти далі, дочекайтеся відповіді Gemini. ↓ прибирає точки.</p></section>
 <section id="result" hidden><h1>Тест завершено</h1><p class="score" id="score"></p><p class="hint">Бал за питання зараховується лише за точний набір відповідей.</p><div id="review"></div><button class="submit" id="restart">Пройти ще раз</button></section>
</main>
<script>
const questions = [
 {title:'Яке місто є столицею України?',multiple:false,options:['Львів','Київ','Одеса','Харків','Дніпро','Чернігів'],correct:[2],why:'Столиця України — Київ.'},
 {title:'Які з наведених чисел є простими?',multiple:true,options:['2','4','5','9','11','15'],correct:[1,3,5],why:'Просте число має рівно два додатні дільники: одиницю та саме себе. Тут це 2, 5 і 11.'},
 {title:'Який пристрій призначений для введення тексту в комп’ютер?',multiple:false,options:['Монітор','Принтер','Колонки','Клавіатура','Проєктор','Навушники'],correct:[4],why:'Клавіатура — пристрій введення тексту. Решта перелічених пристроїв призначені для виведення інформації.'},
 {title:'Які з наведених одиниць використовують для вимірювання обсягу цифрових даних?',multiple:true,options:['Герц','Байт','Ват','Мегабайт','Секунда','Гігабайт'],correct:[2,4,6],why:'Байт, мегабайт і гігабайт вимірюють обсяг даних; герц — частоту, ват — потужність, секунда — час.'},
 {title:'Які з наведених тварин належать до ссавців?',multiple:true,options:['Дельфін','Акула','Кажан','Пінгвін','Кіт','Крокодил'],correct:[1,3,5],why:'Дельфін, кажан і кіт — ссавці. Акула — риба, пінгвін — птах, крокодил — плазун.'}
];
const $=id=>document.getElementById(id);let index=0;let answers=[];
function show(){const q=questions[index];$('counter').textContent=`Питання ${index+1} з ${questions.length}`;$('bar').style.width=`${index/questions.length*100}%`;$('question').textContent=q.title;$('hint').textContent=q.multiple?'Виберіть усі правильні відповіді.':'Виберіть одну правильну відповідь.';$('options').replaceChildren();$('next').disabled=true;$('next').textContent=index===questions.length-1?'Завершити тест ✓':'Готово →';q.options.forEach((text,i)=>{const label=document.createElement('label');label.className='option';const num=document.createElement('span');num.className='num';num.textContent=i+1;const content=document.createElement('span');content.className='text';content.textContent=text;const input=document.createElement('input');input.type=q.multiple?'checkbox':'radio';input.name='answer';input.value=i+1;input.setAttribute('aria-label',`Варіант ${i+1}: ${text}`);label.append(num,content,input);$('options').append(label)});window.scrollTo(0,0)}
$('form').addEventListener('change',()=>{$('next').disabled=!$('form').querySelector('input:checked')});
$('form').addEventListener('submit',e=>{e.preventDefault();const selected=[...$('form').querySelectorAll('input:checked')].map(el=>Number(el.value));if(!selected.length)return;answers.push(selected);if(++index<questions.length){show();return}finish()});
function finish(){$('quiz').hidden=true;$('result').hidden=false;$('counter').textContent='Результат';$('bar').style.width='100%';let total=0;$('review').replaceChildren();questions.forEach((q,i)=>{const ok=JSON.stringify(answers[i])===JSON.stringify(q.correct);if(ok)total++;const box=document.createElement('article');box.className='review';const title=document.createElement('h2');title.textContent=`${i+1}. ${q.title}`;const verdict=document.createElement('div');verdict.className=ok?'ok':'bad';verdict.textContent=ok?'✓ Правильно':'✗ Неправильно';const chosen=document.createElement('div');chosen.textContent='Ваш вибір: '+answers[i].join(', ');const key=document.createElement('div');key.textContent='Правильні варіанти: '+q.correct.join(', ');const why=document.createElement('div');why.textContent=q.why;box.append(title,verdict,chosen,key,why);$('review').append(box)});$('score').textContent=`${total} із ${questions.length} · ${total/questions.length*100}%`;window.scrollTo(0,0)}
$('restart').addEventListener('click',()=>{index=0;answers=[];$('quiz').hidden=false;$('result').hidden=true;show()});show();
</script>
</html>
